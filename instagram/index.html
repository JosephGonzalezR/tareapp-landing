  <script>
    (function () {
      var TEL = "56233990000";
      var MSG = "Hola, vengo de Instagram. Quiero hacer una consulta.";
      var Q = "phone=" + TEL + "&text=" + encodeURIComponent(MSG);
      var WEB = "https://wa.me/" + TEL + "?text=" + encodeURIComponent(MSG);
      var ESQUEMA = "whatsapp://send?" + Q;
      var INTENT = "intent://send/?" + Q + "#Intent;scheme=whatsapp;S.browser_fallback_url=" + encodeURIComponent(WEB) + ";end";

      var ua = navigator.userAgent || "";
      var android = /Android/i.test(ua);
      var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      // navegadores internos de redes (TikTok = musical_ly / trill / Bytedance)
      var interno = /musical_ly|trill_|Bytedance|TikTok|Instagram|FBAN|FBAV|FB_IAB|Line\//i.test(ua);

      var abrir = document.getElementById("abrir");

      // Dentro de TikTok (y de Instagram o Facebook) en el celular: la app se abre con su propio esquema,
      // porque wa.me se queda en la web de WhatsApp. Fuera de esos navegadores, wa.me funciona y se deja tal cual.
      // Nada redirige solo a wa.me: TikTok revisa el destino del enlace del perfil.
      if (interno && (android || ios)) {
        abrir.href = ESQUEMA;
        document.getElementById("ayuda").hidden = false;
        // intento automatico en un iframe oculto: si el navegador interno lo frena, la pagina no se rompe
        setTimeout(function () {
          var f = document.createElement("iframe");
          f.style.display = "none";
          f.src = ESQUEMA;
          document.body.appendChild(f);
        }, 300);
        if (android) {
          // si con el toque la app no se abrio en 1,2 s, segundo intento por intent (algunos navegadores internos solo atienden ese)
          abrir.addEventListener("click", function () {
            setTimeout(function () { if (!document.hidden) window.location.href = INTENT; }, 1200);
          });
        }
      }

      document.getElementById("copiar").addEventListener("click", function () {
        var b = this, t = "+56 2 3399 0000";
        function listo() { b.textContent = "Número copiado"; b.className = "hecho"; }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(t).then(listo, function () { window.prompt("Copia el número:", t); });
        } else { window.prompt("Copia el número:", t); }
      });
    })();
